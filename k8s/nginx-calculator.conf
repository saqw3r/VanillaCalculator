# Place in /etc/nginx/sites-available/calculator (or include in main config)
# Then: sudo ln -s /etc/nginx/sites-available/calculator /etc/nginx/sites-enabled/
# Then: sudo nginx -s reload

# API proxy → k3s NodePort
location /calculator/api/ {
    rewrite ^/calculator/api/(.*) /api/$1 break;
    proxy_pass http://127.0.0.1:30080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# Frontend static files (copy Next.js out/ contents here)
location /calculator/ {
    alias /var/www/calculator/;
    try_files $uri $uri/index.html;
}
