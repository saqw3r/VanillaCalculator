services:
  calculator-api:
    build:
      context: ./CalculatorApi
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=calculator;Username=calculator;Password=calculator_pass"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api-logs:/app/logs

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: calculator
      POSTGRES_USER: calculator
      POSTGRES_PASSWORD: calculator_pass
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calculator"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  api-logs:
